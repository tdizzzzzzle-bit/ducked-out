  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />

<body>

  <!-- Loading overlay -->

    <img src="Gerald.gif" alt="Loading..." style="width:220px; filter:drop-shadow(0 8px 32px rgba(0,0,0,0.4));" />
    <div style="font-family:'Fredoka',sans-serif; font-weight:700; font-size:1.4rem; color:#F5C842; margin-top:1.5rem; letter-spacing:0.02em;">Hang tight...</div>
    <div style="font-family:'Nunito',sans-serif; font-size:0.95rem; color:rgba(255,255,255,0.6); margin-top:0.5rem;">Gerald is processing your order.</div>
  </div>

  <nav>
    <a href="index.html" class="nav-logo">
      <img src="Gerald.svg" alt="Duck & Cover" class="nav-duck" />
      <span>Duck & Cover</span>
    </a>
    <div class="nav-links">
      <a href="shop.html">Shop</a>
      <a href="about.html">About</a>
    </div>
    <button class="nav-toggle" onclick="toggleNav()">☰</button>
  </nav>

  <div class="mobile-menu" id="mobileMenu">
    <a href="shop.html" onclick="toggleNav()">Shop</a>
    <a href="about.html" onclick="toggleNav()">About</a>
  </div>

  <div class="container product-page" id="productPage">
    <p>Loading...</p>
  </div>

  <section class="related-section">
    <div class="container">
      <h2>More Like This</h2>
      <div class="product-grid" id="relatedGrid"></div>
    </div>
  </section>

  <footer>
    <div class="container footer-inner">
      <a href="index.html" class="footer-logo">Duck & Cover</a>
      <p>© <span id="year"></span> Duck & Cover. All ducks reserved.</p>
      <div class="footer-links">
        <a href="shop.html">Shop</a>
        <a href="about.html">About</a>
      </div>
    </div>
  </footer>

  <script src="products.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    function toggleNav() {
      document.getElementById('mobileMenu').classList.toggle('open');
    }

    var urlParams   = new URLSearchParams(window.location.search);
    var IS_ADMIN    = urlParams.get('admin') === 'quack';
    var productId   = urlParams.get('id');

    var uploadedFile     = null;
    var uploadedFileName = '';

    const SHIRT_COLORS = [

      // Blacks
      { name: 'Vintage Black', hex: '#212322' },
      { name: 'Black Heather', hex: '#454038' },
      { name: 'Black', hex: '#211e16' },
      { name: 'Oxblood Black', hex: '#3f2537' },
      // Pinks & Reds

      { name: 'Baby Blue', hex: '#83b0c1' },

      { name: 'Turquoise', hex: '#00afd7' },
      { name: 'Teal', hex: '#00bfb3' },
      { name: 'Heather Deep Teal', hex: '#34657f' },
      { name: 'Ocean Blue', hex: '#62a8c1' },
      { name: 'Heather Carolina Blue', hex: '#8baad4' },
      { name: 'Heather Columbia Blue', hex: '#658bcc' },
      { name: 'Steel Blue', hex: '#5f849c' },
      { name: 'Heather True Royal', hex: '#24509a' },
      { name: 'True Royal', hex: '#3b61a6' },
      { name: 'Heather Navy', hex: '#3b4559' },
      { name: 'Heather Midnight Navy', hex: '#313546' },
      { name: 'Navy', hex: '#1f2a44' },
      // Purples & Mauve
      { name: 'Mauve', hex: '#a36d6a' },
      { name: 'Heather Prism Lilac', hex: '#c7a1b2' },
      { name: 'Lilac', hex: '#d1acce' },
      { name: 'Heather Mauve', hex: '#b07e7b' },
      { name: 'Heather Team Purple', hex: '#7d55c7' },
      { name: 'Team Purple', hex: '#2e1a47' },
      // Browns & Tans
      { name: 'Heather Clay', hex: '#a26859' },
      { name: 'Tan', hex: '#afa17c' },
      { name: 'Brown', hex: '#5e514d' },
      { name: 'Heather Brown', hex: '#5e4b3c' },
    ];

    var MODELS = {
      man:   { shirt: 'model_shirt.png',  arms: 'model_arms.png'  },
      woman: { shirt: 'woman_shirt.png',  arms: 'woman_arms.png'  },
      child: { shirt: 'child_shirt.png',  arms: 'child_arms.png'  },
    };

    var currentModel  = 'man';
    var currentColor  = '#FFFFFF';
    var currentHeather = false;
    var selectedSize  = '';

    // Preload all model images
    var modelImgs = {};
    Object.keys(MODELS).forEach(function(key) {
      modelImgs[key] = {
        shirt: new Image(),
        arms:  new Image(),
      };
      modelImgs[key].shirt.src = MODELS[key].shirt;
      modelImgs[key].arms.src  = MODELS[key].arms;
    });

    // Aliases for current model (used by renderMockup)
    var shirtImg = modelImgs.man.shirt;
    var armsImg  = modelImgs.man.arms;

    function hexToRgb(hex) {
      return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
    }

    function renderMockup(hex, heather) {
      var canvas = document.getElementById('shirtCanvas');
      var mImgs  = modelImgs[currentModel];
      if (!canvas || !mImgs.arms.naturalWidth) return;
      var ctx = canvas.getContext('2d');
      canvas.width  = mImgs.arms.naturalWidth;
      canvas.height = mImgs.arms.naturalHeight;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(mImgs.arms, 0, 0, canvas.width, canvas.height);
      var off = document.createElement('canvas');
      off.width  = mImgs.shirt.naturalWidth;
      off.height = mImgs.shirt.naturalHeight;
      var offCtx = off.getContext('2d');
      offCtx.drawImage(mImgs.shirt, 0, 0);
      var imgData = offCtx.getImageData(0, 0, off.width, off.height);
      var d = imgData.data;
      var rgb = hexToRgb(hex);
      for (var i = 0; i < d.length; i += 4) {
        if (d[i+3] < 10) continue;
        var b = (d[i] + d[i+1] + d[i+2]) / (255 * 3);
        if (heather) {
          // Add random fiber noise to simulate heathered fabric
          b = b + (Math.random() - 0.5) * 0.20;
          b = Math.max(0, Math.min(1, b));
        }
        d[i]   = Math.min(255, Math.round(rgb[0] * b));
        d[i+1] = Math.min(255, Math.round(rgb[1] * b));
        d[i+2] = Math.min(255, Math.round(rgb[2] * b));
      }
      offCtx.putImageData(imgData, 0, 0);
      ctx.drawImage(off, 0, 0, canvas.width, canvas.height);
    }

    function isHeather(name) {
      return name.toLowerCase().indexOf('heather') !== -1
          || name.toLowerCase().indexOf('hthr') !== -1;
    }

    function setShirtColor(hex, name) {
      currentColor   = hex;
      currentHeather = isHeather(name);
      document.getElementById('colorLabel').textContent = name;
      document.querySelectorAll('.color-swatch').forEach(function(s) {
        s.classList.toggle('active', s.dataset.hex === hex);
      });
      renderMockup(hex, currentHeather);
      updateSizeAvailability();
    }

    function setModel(key) {
      currentModel = key;
      document.querySelectorAll('.model-btn').forEach(function(b) {
        b.classList.toggle('active', b.dataset.model === key);
      });
      renderMockup(currentColor, currentHeather);
    }

    function setSize(size) {
      selectedSize = size;
      document.querySelectorAll('.size-btn').forEach(function(b) {
        b.classList.toggle('active', b.dataset.size === size);
      });
      var note = document.getElementById('buyNote');
      if (note) note.textContent = size + ' selected. Ready to checkout.';
    }

    function isAvailable(colorName, size) {
      if (!colorName) return true; // no color selected yet
      if (Object.keys(stockData).length === 0) return true; // stock not loaded yet
      var key = colorName + ' / ' + size;
      // If key exists in stockData, use it; otherwise assume available
      return key in stockData ? stockData[key] : true;
    }

    function isColorAvailable(colorName) {
      if (Object.keys(stockData).length === 0) return true;
      var sizes = ['XS', 'S', 'M', 'L', 'XL', '2XL', '3XL'];
      // Color is available if at least one size is available
      return sizes.some(function(s) {
        var key = colorName + ' / ' + s;
        return !(key in stockData) || stockData[key];
      });
    }

    function updateSizeAvailability() {
      var colorName = document.getElementById('colorLabel')?.textContent;
      document.querySelectorAll('.size-btn').forEach(function(btn) {
        var size = btn.dataset.size;
        var avail = isAvailable(colorName, size);
        btn.disabled = !avail;
        btn.style.opacity = avail ? '1' : '0.35';
        btn.style.textDecoration = avail ? 'none' : 'line-through';
        btn.title = avail ? '' : 'Out of stock';
        // Deselect if current selection becomes unavailable
        if (!avail && selectedSize === size) {
          selectedSize = '';
          btn.classList.remove('active');
        }
      });
    }

    function updateColorAvailability() {
      document.querySelectorAll('.color-swatch').forEach(function(btn) {
        var colorName = btn.title;
        var avail = isColorAvailable(colorName);
        btn.disabled = !avail;
        btn.style.opacity = avail ? '1' : '0.3';
        btn.style.cursor = avail ? 'pointer' : 'not-allowed';
        if (!avail) btn.title = colorName + ' (out of stock)';
      });
    }

    async function loadStock(productId) {
      try {
        var res = await fetch(WORKER_URL + '/get-stock?productId=' + productId);
        stockData = await res.json();
        updateColorAvailability();
        updateSizeAvailability();
      } catch (err) {
        console.log('Stock check failed, assuming all available');
      }
    }

    function updateDesign() {
      var design = document.getElementById('shirtDesign');
      if (!design) return;
      var size = document.getElementById('sliderSize').value;
      var x    = document.getElementById('sliderX').value;
      var y    = document.getElementById('sliderY').value;
      design.style.width = size + '%';
      design.style.left  = x + '%';
      design.style.top   = y + '%';
      document.getElementById('labelSize').textContent = size + '%';
      document.getElementById('labelX').textContent    = x + '%';
      document.getElementById('labelY').textContent    = y + '%';
    }

    function handleImageUpload(input) {
      var file = input.files[0];
      if (!file) return;
      uploadedFile     = file;
      uploadedFileName = file.name;
      var reader = new FileReader();
      reader.onload = function(e) {
        var design = document.getElementById('shirtDesign');
        design.src = e.target.result;
        var dropText = document.getElementById('imageDropText');
        if (dropText) {
          dropText.innerHTML = '✓ <strong>' + file.name + '</strong><br><small>Click to change</small>';
          document.getElementById('imageDropZone').style.borderColor = '#2D5A27';
          document.getElementById('imageDropZone').style.background  = '#f0fff4';
        }
      };
      reader.readAsDataURL(file);
    }

    function serializeProducts(arr) {
      var rows = arr.map(function(p) {
        return '  {\n'
          + '    id: "' + p.id + '",\n'
          + '    name: "' + p.name.replace(/"/g, '\\"') + '",\n'
          + '    shortDescription: "' + p.shortDescription.replace(/"/g, '\\"') + '",\n'
          + '    description: "' + p.description.replace(/"/g, '\\"') + '",\n'
          + '    price: ' + p.price + ',\n'
          + '    image: "' + p.image + '",\n'
          + '    stripeLink: "' + p.stripeLink + '",\n'
          + '    placement: { size: ' + p.placement.size + ', x: ' + p.placement.x + ', y: ' + p.placement.y + ' },\n'
          + '  }';
      });
      return 'const products = [\n' + rows.join(',\n') + ',\n];\n';
    }

    async function exportUpdate(pid) {
      var size   = parseInt(document.getElementById('sliderSize').value);
      var x      = parseInt(document.getElementById('sliderX').value);
      var y      = parseInt(document.getElementById('sliderY').value);
      var name   = document.getElementById('editName').value.trim();
      var short  = document.getElementById('editShort').value.trim();
      var desc   = document.getElementById('editDesc').value.trim();
      var price  = parseFloat(document.getElementById('editPrice').value);
      var stripe = document.getElementById('editStripe').value.trim();
      var image  = uploadedFile ? uploadedFileName
                                : products.find(function(p){return p.id===pid;}).image;

      var updated = products.map(function(p) {
        if (p.id !== pid) return p;
        return {
          id:               p.id,
          name:             name   || p.name,
          shortDescription: short  || p.shortDescription,
          description:      desc   || p.description,
          price:            isNaN(price) ? p.price : price,
          image:            image,
          stripeLink:       stripe || p.stripeLink,
          placement:        { size: size, x: x, y: y },
        };
      });

      var zip = new JSZip();
      zip.file('products.js', serializeProducts(updated));

      if (uploadedFile) {
        var imgData = await new Promise(function(resolve, reject) {
          var reader = new FileReader();
          reader.onload  = function(e) { resolve(e.target.result); };
          reader.onerror = reject;
          reader.readAsArrayBuffer(uploadedFile);
        });
        zip.file(uploadedFileName, imgData);
      }

      var blob = await zip.generateAsync({ type: 'blob' });
      var url  = URL.createObjectURL(blob);
      var a    = document.createElement('a');
      a.href     = url;
      a.download = 'duck-update-' + pid + '.zip';
      a.click();
      URL.revokeObjectURL(url);

      var btn = document.getElementById('exportBtn');
      btn.textContent      = '✓ Downloaded!';
      btn.style.background = '#2D5A27';
      btn.style.color      = 'white';
      setTimeout(function() {
        btn.textContent      = '⬇ Export Update';
        btn.style.background = '';
        btn.style.color      = '';
      }, 2500);
    }

    var WORKER_URL = 'https://duck-and-cover-worker.tdizzzzzzle.workers.dev';
    var stockData = {}; // populated after page loads

    async function handleBuyNow() {
      // Validate size selected
      if (!selectedSize) {
        var btn = document.getElementById('buyBtn');
        btn.textContent = 'Please select a size first!';
        btn.style.background = '#C41230';
        setTimeout(function() {
          btn.textContent = 'Buy Now →';
          btn.style.background = '';
        }, 2000);
        return;
      }

      var btn = document.getElementById('buyBtn');
      btn.textContent = 'Loading...';
      btn.disabled = true;
      btn.style.opacity = '0.7';

      // Show Gerald loading overlay
      var overlay = document.getElementById('loadingOverlay');
      overlay.style.display = 'flex';

      try {
        var res = await fetch(WORKER_URL + '/create-checkout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            productId:   product.id,
            productName: product.name,
            color:       currentColor,
            colorName:   document.getElementById('colorLabel').textContent,
            size:        selectedSize,
            price:       product.price,
          }),
        });

        var data = await res.json();

        if (data.url) {
          window.location.href = data.url;
        } else {
          throw new Error(data.error || 'No checkout URL returned');
        }
      } catch (err) {
        console.error('Checkout error:', err);
        overlay.style.display = 'none';
        btn.textContent = 'Error — try again';
        btn.style.background = '#C41230';
        btn.disabled = false;
        btn.style.opacity = '1';
        setTimeout(function() {
          btn.textContent = 'Buy Now →';
          btn.style.background = '';
        }, 3000);
      }
    }

    var imagesReady = 0;
    function imageLoaded() {
      imagesReady++;
      // Only need man model ready to start (others load in background)
      if (imagesReady >= 2) renderMockup('#FFFFFF', false);
    }
    modelImgs.man.shirt.addEventListener('load', imageLoaded);
    modelImgs.man.arms.addEventListener('load',  imageLoaded);
    if (modelImgs.man.shirt.complete) imageLoaded();
    if (modelImgs.man.arms.complete)  imageLoaded();

    var product = null;
    for (var i = 0; i < products.length; i++) {
      if (products[i].id === productId) { product = products[i]; break; }
    }

    var page = document.getElementById('productPage');

    if (!product) {
      page.innerHTML = '<p>Product not found. <a href="shop.html">Back to shop</a></p>';
    } else {
      document.title = product.name + ' — Duck & Cover';
      var pl = (product.placement && typeof product.placement.size !== 'undefined')
        ? product.placement : { size: 40, x: 30, y: 35 };

      var swatchHTML = '';
      SHIRT_COLORS.forEach(function(c) {
        swatchHTML += '<button'
          + ' class="color-swatch' + (c.hex === '#FFFFFF' ? ' active' : '') + '"'
          + ' style="background:' + c.hex + ';' + (c.hex === '#FFFFFF' ? 'border-color:#C0B8A8;' : '') + '"'
          + ' data-hex="' + c.hex + '" title="' + c.name + '"'
          + ' onclick="setShirtColor(\'' + c.hex + '\',\'' + c.name + '\')">'
          + '</button>';
      });

      var adminHTML = '';
      if (IS_ADMIN) {
        adminHTML =
          // ── Position panel ──
          '<div class="admin-panel" style="margin-top:1rem;">'
          + '<div class="admin-title">🛠 Admin — ' + product.name + '</div>'
          + '<div class="admin-row"><label>Size: <strong id="labelSize">' + pl.size + '%</strong></label>'
          + '<input id="sliderSize" type="range" min="1" max="100" value="' + pl.size + '" oninput="updateDesign()" /></div>'
          + '<div class="admin-row"><label>X: <strong id="labelX">' + pl.x + '%</strong></label>'
          + '<input id="sliderX" type="range" min="0" max="90" value="' + pl.x + '" oninput="updateDesign()" /></div>'
          + '<div class="admin-row"><label>Y: <strong id="labelY">' + pl.y + '%</strong></label>'
          + '<input id="sliderY" type="range" min="0" max="90" value="' + pl.y + '" oninput="updateDesign()" /></div>'
          + '</div>'

          // ── Edit fields panel ──
          + '<div class="admin-panel" style="margin-top:0.75rem;">'
          + '<div class="admin-title">✏️ Edit Product Details</div>'

          + '<div class="form-group">'
          + '<label class="admin-field-label">Name</label>'
          + '<input class="admin-field-input" id="editName" type="text" value="' + product.name + '" />'
          + '</div>'

          + '<div class="form-group">'
          + '<label class="admin-field-label">Short Description</label>'
          + '<input class="admin-field-input" id="editShort" type="text" value="' + product.shortDescription.replace(/"/g, '&quot;') + '" />'
          + '</div>'

          + '<div class="form-group">'
          + '<label class="admin-field-label">Full Description</label>'
          + '<textarea class="admin-field-input admin-field-textarea" id="editDesc">' + product.description + '</textarea>'
          + '</div>'

          + '<div class="form-group">'
          + '<label class="admin-field-label">Price ($)</label>'
          + '<input class="admin-field-input" id="editPrice" type="number" value="' + product.price + '" step="1" min="1" />'
          + '</div>'

          + '<div class="form-group">'
          + '<label class="admin-field-label">Stripe Link</label>'
          + '<input class="admin-field-input" id="editStripe" type="text" value="' + product.stripeLink + '" />'
          + '</div>'

          + '<div class="form-group">'
          + '<label class="admin-field-label">Replace Image (optional)</label>'
          + '<div class="file-drop" id="imageDropZone" onclick="document.getElementById(\'imageInput\').click()">'
          + '<div id="imageDropText">Current: <strong>' + product.image + '</strong><br><small>Click to upload a new SVG or PNG</small></div>'
          + '<input id="imageInput" type="file" accept=".svg,.png" style="display:none" onchange="handleImageUpload(this)" />'
          + '</div>'
          + '</div>'

          + '<button id="exportBtn" class="admin-export" onclick="exportUpdate(\'' + product.id + '\')">'
          + '⬇ Export Update</button>'
          + '<div class="admin-hint" style="margin-top:0.5rem;">Downloads updated products.js (+ new image if changed). Drop in project folder and push.</div>'
          + '</div>';
      }

      page.innerHTML =
        '<div class="breadcrumb">'
        + '<a href="' + (IS_ADMIN ? 'shop.html?admin=quack' : 'shop.html') + '">← Shop</a>'
        + ' / <span>' + product.name + '</span>'
        + '</div>'
        + '<div class="product-detail">'

        // Left: mockup + admin controls
        + '<div class="product-detail-img">'
        + '<div class="shirt-mockup">'
        + '<canvas id="shirtCanvas" class="shirt-canvas"></canvas>'
        + '<img id="shirtDesign" src="' + product.image + '" alt="' + product.name + '" class="shirt-design"'
        + ' style="width:' + pl.size + '%; left:' + pl.x + '%; top:' + pl.y + '%;" />'
        + '</div>'
        + adminHTML
        + '</div>'

        // Right: product info
        + '<div class="product-detail-info">'
        + '<h1>' + product.name + '</h1>'
        + '<div class="product-price">$' + product.price + '</div>'
        + '<div class="size-selector">'
        + '<div class="size-label">Size</div>'
        + '<div class="size-btns">'
        + '<button class="size-btn" data-size="S"   onclick="setSize(\'S\')">S</button>'
        + '<button class="size-btn" data-size="M"   onclick="setSize(\'M\')">M</button>'
        + '<button class="size-btn" data-size="L"   onclick="setSize(\'L\')">L</button>'
        + '<button class="size-btn" data-size="XL"  onclick="setSize(\'XL\')">XL</button>'
        + '<button class="size-btn" data-size="2XL" onclick="setSize(\'2XL\')">2XL</button>'
        + '<button class="size-btn" data-size="3XL" onclick="setSize(\'3XL\')">3XL</button>'
        + '</div>'
        + '</div>'
        + '<p class="product-description">' + product.description + '</p>'
        + '<div class="color-picker-section">'
        + '<div class="color-picker-label">Shirt Color — <span id="colorLabel">White</span></div>'
        + '<div class="color-swatches">' + swatchHTML + '</div>'
        + '</div>'
        + '<button id="buyBtn" class="btn btn-buy" onclick="handleBuyNow()">Buy Now →</button>'
        + '</div>';

      if (imagesReady >= 2) renderMockup('#FFFFFF');

      // Load stock availability in background
      loadStock(product.id);

      var relGrid = document.getElementById('relatedGrid');
      products.forEach(function(p) {
        if (p.id === product.id) return;
        relGrid.innerHTML +=
          '<a href="product.html?id=' + p.id + (IS_ADMIN ? '&admin=quack' : '') + '" class="product-card">'
          + '<div class="card-img"><img src="' + p.image + '" alt="' + p.name + '" /></div>'
          + '<div class="card-info"><h3>' + p.name + '</h3><p>' + p.shortDescription + '</p>'
          + '<span class="price">$' + p.price + '</span></div></a>';
      });
    }
  </script>
</body>
</html>
