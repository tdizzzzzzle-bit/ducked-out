    var uploadedFile     = null;

      'Clay': '#b37868', 'Columbia Blue': '#5571a4', 'Cool Blue': '#01426a',

      'Heather Columbia Blue': '#658bcc', 'Heather Deep Teal': '#34657f',
      'Heather Dust': '#cdc6bd', 'Heather Emerald': '#13322b',

      'Ice Blue': '#b3d0cd', 'Kelly': '#007a53', 'Leaf': '#659256',

      'Soft Pink': '#eed9d4', 'Steel Blue': '#5f849c', 'Tan': '#afa17c',
      'Teal': '#00bfb3', 'Team Purple': '#2e1a47', 'Toast': '#9e6a38',
      'True Royal': '#3b61a6', 'Turquoise': '#00afd7', 'Vintage Black': '#212322',
      'Vintage White': '#dfddd7', 'White': '#f4f5f0', 'Yellow': '#fcea76',

    // Printful ghost shirt — public CDN, no auth needed
    // Printful catalog product -> ghost mockup + print area (both 3000x3000 canvases).
    // print area is stored as % of canvas so the design lands correctly on any garment.
    var GARMENTS = {
      71: {  // Bella+Canvas 3001
        ghost: 'https://files.cdn.printful.com/m/57-bc3001/medium/ghost/front/05_bc3001_ghost_front_base_whitebg.png?v=1753256383',
        area:  { left: 1006/3000, top: 530/3000, width: 1010/3000, height: 1346/3000 }
      },
      849: { // Gildan 64000L women's
        ghost: 'https://files.cdn.printful.com/m/Gildan64000L/medium/ghost/front/05_ghost_front_base_whitebg.png?v=1768556071',
        area:  { left: 856/3000, top: 435/3000, width: 1286/3000, height: 1714/3000 }
      }
    };
    var DEFAULT_AREA = GARMENTS[71].area;

    var TIER_LABELS = { M: "Men's", W: "Women's", K: "Kids'", Y: "Youth" };

    function proxied(url) {
      return 'https://duck-and-cover-worker.tdizzzzzzle.workers.dev/ghost?url=' + encodeURIComponent(url);
    }

    var stockGroups  = {};    // key -> { garment, tier, catalogId, stock }
    var currentGroup = null;  // active tab key

    var shirtImg = new Image();
    shirtImg.crossOrigin = 'anonymous';

    var currentColor   = '#211e16';
    var currentHeather = false;
    var selectedSize   = '';

    function hexToRgb(hex) {
      return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
    }

    // 'cutout'  = shirt area is transparent, colour goes BEHIND the ghost
    // 'tint'    = shirt pixels are opaque, colour multiplies INTO them
    var ghostMode = null;

    function detectGhostMode(d, w, h) {
      function alphaAt(px, py) { return d[(((py|0) * w + (px|0)) * 4) + 3]; }
      var corner = alphaAt(5, 5);
      var chest  = alphaAt(w * 0.50, h * 0.45);
      var mode = (chest < 40 && corner > 200) ? 'cutout' : 'tint';
      console.log('[mockup] ghost mode:', mode, '| corner alpha', corner, '| chest alpha', chest);
      return mode;
    }

    function renderMockup(hex, heather) {
      var canvas = document.getElementById('shirtCanvas');
      if (!canvas || !shirtImg.naturalWidth) return;
      var w = shirtImg.naturalWidth, h = shirtImg.naturalHeight;
      var ctx = canvas.getContext('2d');
      canvas.width = w; canvas.height = h;
      ctx.clearRect(0, 0, w, h);

      var off = document.createElement('canvas');
      off.width = w; off.height = h;
      var offCtx = off.getContext('2d');
      offCtx.drawImage(shirtImg, 0, 0);
      var imgData = offCtx.getImageData(0, 0, w, h);
      var d = imgData.data;
      var rgb = hexToRgb(hex);

      if (ghostMode === null) ghostMode = detectGhostMode(d, w, h);

      if (ghostMode === 'cutout') {
        // Colour behind, ghost on top: the transparent shirt area shows the
        // colour, and the ghost's semi-transparent pixels supply the shading.
        if (heather) {
          var noise = ctx.createImageData(w, h);
          var nd = noise.data;
          for (var n = 0; n < nd.length; n += 4) {
            var j = (Math.random() - 0.5) * 0.40;
            nd[n]   = Math.min(255, Math.max(0, Math.round(rgb[0] * (1 + j))));
            nd[n+1] = Math.min(255, Math.max(0, Math.round(rgb[1] * (1 + j))));
            nd[n+2] = Math.min(255, Math.max(0, Math.round(rgb[2] * (1 + j))));
            nd[n+3] = 255;
          }
          ctx.putImageData(noise, 0, 0);
        } else {
          ctx.fillStyle = hex;
          ctx.fillRect(0, 0, w, h);
        }
        ctx.drawImage(shirtImg, 0, 0, w, h);
        return;
      }

      // 'tint': every opaque pixel is shirt fabric
      for (var i = 0; i < d.length; i += 4) {
        if (d[i+3] < 10) continue;
        var b = (d[i] + d[i+1] + d[i+2]) / (255 * 3);
        if (heather) {
          b = b + (Math.random() - 0.5) * 0.40;
          b = Math.max(0, Math.min(1, b));
        }
        d[i]   = Math.min(255, Math.round(rgb[0] * b));
        d[i+1] = Math.min(255, Math.round(rgb[1] * b));
        d[i+2] = Math.min(255, Math.round(rgb[2] * b));
      }
      offCtx.putImageData(imgData, 0, 0);
      ctx.drawImage(off, 0, 0, w, h);
    }

    function isHeather(name) {
      return name.toLowerCase().indexOf('heather') !== -1
          || name.toLowerCase().indexOf('hthr') !== -1;
    }

    function setShirtColor(hex, name) {
      currentColor   = hex;
      currentHeather = isHeather(name);
      document.getElementById('colorLabel').textContent = name;
      var swatchCont = document.getElementById('colorSwatchContainer');
      if (swatchCont) swatchCont.querySelectorAll('.color-swatch').forEach(function(s) {
        s.classList.toggle('active', s.dataset.hex === hex);
      });
      renderMockup(hex, currentHeather);
      updateSizeAvailability();
      updatePrice();
    }

    function setSize(size) {
      selectedSize = size;
      document.querySelectorAll('.size-btn').forEach(function(b) {
        b.classList.toggle('active', b.dataset.size === size);
      });
      updatePrice();
    }

    function isAvailable(colorName, size) {
      if (!colorName) return true;
      if (Object.keys(stockData).length === 0) return true;
      var key = colorName + ' / ' + size;
      if (!(key in stockData)) return true;
      return stockData[key].available !== false;
    }

    function isColorAvailable(colorName) {
      if (Object.keys(stockData).length === 0) return true;
      var sizes = ['XS', 'S', 'M', 'L', 'XL', '2XL', '3XL'];
      return sizes.some(function(s) {
        var key = colorName + ' / ' + s;
        return !(key in stockData) || stockData[key].available !== false;
      });
    }

    function updateSizeAvailability() {
      var colorName = document.getElementById('colorLabel')?.textContent;
      document.querySelectorAll('.size-btn').forEach(function(btn) {
        var size = btn.dataset.size;
        var avail = isAvailable(colorName, size);
        btn.disabled = !avail;
        btn.style.opacity = avail ? '1' : '0.35';
        btn.style.textDecoration = avail ? 'none' : 'line-through';
        btn.title = avail ? '' : 'Out of stock';
        // Deselect if current selection becomes unavailable
        if (!avail && selectedSize === size) {
          selectedSize = '';
          btn.classList.remove('active');
        }
      });
    }

    function updateColorAvailability() {
      var container = document.getElementById('colorSwatchContainer');
      if (!container) return;
      container.querySelectorAll('.color-swatch').forEach(function(btn) {
        var colorName = btn.title;
        var avail = isColorAvailable(colorName);
        btn.disabled = !avail;
        btn.style.opacity = avail ? '1' : '0.3';
        btn.style.cursor = avail ? 'pointer' : 'not-allowed';
        if (!avail) btn.title = colorName + ' (out of stock)';
      });
    }

    async function loadStock(productId) {
      try {
        var res  = await fetch(WORKER_URL + '/get-stock?productId=' + productId);
        var data = await res.json();
        stockGroups = (data && data.groups) ? data.groups : {};

        var keys = Object.keys(stockGroups);
        if (!keys.length) { console.warn('[stock] no garment groups returned'); return; }

        buildGarmentTabs();

        // Prefer men's/unisex as the default tab
        var first = keys.filter(function(k){ return stockGroups[k].tier === 'M'; })[0] || keys[0];
        switchGroup(first);
      } catch (err) {
        console.log('Stock check failed, assuming all available', err);
      }
    }

    function currentColorName() {
      var el = document.getElementById('colorLabel');
      return el ? el.textContent : 'Black';
    }

    function getPrice() {
      var colorName = document.getElementById('colorLabel') ? document.getElementById('colorLabel').textContent : '';
      if (!colorName || colorName === 'White' && Object.keys(stockData).length === 0) return null;
      if (!selectedSize) return null;
      var key = colorName + ' / ' + selectedSize;
      return stockData[key] ? stockData[key].price : null;
    }

    var SIZE_ORDER = ['XS', 'S', 'M', 'L', 'XL', '2XL', '3XL'];

    function buildColorSwatches() {
      var container = document.getElementById('colorSwatchContainer');
      if (!container || Object.keys(stockData).length === 0) return;

      var colorSet = {};
      Object.keys(stockData).forEach(function(key) {
        var parts = key.split(' / ');
        if (parts.length === 2) {
          var name = parts[0];
          if (!colorSet[name]) colorSet[name] = COLOR_HEX[name] || '#999999';
        }
      });

      var html = '';

      function toHSL(hex) {
        var r=parseInt(hex.slice(1,3),16)/255, g=parseInt(hex.slice(3,5),16)/255, b=parseInt(hex.slice(5,7),16)/255;
        var max=Math.max(r,g,b), min=Math.min(r,g,b), d=max-min;
        var l=(max+min)/2, s=d===0?0:(l<0.5?d/(2*l):d/(2-2*l)), h=0;
        if(d>0){
          if(max===r) h=((g-b)/d+6)%6;
          else if(max===g) h=(b-r)/d+2;
          else h=(r-g)/d+4;
          h/=6;
        }
        return {h:h, s:s, l:l};
      }

      Object.keys(colorSet)
        .sort(function(a,b){
          var ha=toHSL(colorSet[a]), hb=toHSL(colorSet[b]);
          var aGrey=ha.s<0.12, bGrey=hb.s<0.12;
          if(aGrey && bGrey) return hb.l - ha.l;   // both grey: lighter first
          if(aGrey) return -1;                       // greys before colors
          if(bGrey) return 1;
          if(Math.abs(ha.h-hb.h) > 0.02) return ha.h - hb.h; // sort by hue
          return hb.l - ha.l;                        // same hue: lighter first
        })
        .forEach(function(name) {
          var hex = colorSet[name];
          var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
          var bright=(r*299+g*587+b*114)/1000;
          var border = bright > 200 ? 'border-color:#C0B8A8;' : '';
          html += '<button class="color-swatch" style="background:' + hex + ';' + border + '"'
                + ' data-hex="' + hex + '" title="' + name + '"'
                + ' onclick="setShirtColor(\'' + hex + '\',\'' + name + '\')">'
                + '</button>';
        });

      container.innerHTML = html;

      container.querySelectorAll('.color-swatch').forEach(function(s) {
        s.classList.toggle('active', s.dataset.hex === currentColor);
      });
    }

    function buildSizeButtons() {
      var colorName = document.getElementById('colorLabel') ? document.getElementById('colorLabel').textContent : '';
      var container = document.getElementById('sizeBtns');
      if (!container || Object.keys(stockData).length === 0) return;

      // Get all sizes available for ANY color (so buttons don't disappear on color change)
      var allSizes = new Set();
      Object.keys(stockData).forEach(function(key) {
        var parts = key.split(' / ');
        if (parts.length === 2) allSizes.add(parts[1]);
      });

      // Sort in standard order
      var sorted = SIZE_ORDER.filter(function(s) { return allSizes.has(s); });

      container.innerHTML = sorted.map(function(size) {
        return '<button class="size-btn" data-size="' + size + '" onclick="setSize(\'' + size + '\')">' + size + '</button>';
      }).join('');

      // Re-apply active state if size already selected
      if (selectedSize) {
        container.querySelectorAll('.size-btn').forEach(function(b) {
          b.classList.toggle('active', b.dataset.size === selectedSize);
        });
      }

      updateSizeAvailability();
    }

    function updatePrice() {
      var priceEl = document.getElementById('productPriceDisplay');
      if (!priceEl) return;
      var price = getPrice();
      if (price) {
        priceEl.textContent = '$' + price.toFixed(2);
      }
      // Otherwise leave as-is (shows default product.price or ~)
    }

    // Places the design within the active garment's print area.
    // placement {size,x,y} is interpreted as % OF THE PRINT BOX, so a design
    // tuned on one garment stays correct on the others.
    function applyDesignPlacement(size, x, y) {
      var design = document.getElementById('shirtDesign');
      if (!design) return;
      var g    = currentGroup && stockGroups[currentGroup];
      var area = (g && GARMENTS[g.catalogId] && GARMENTS[g.catalogId].area) || DEFAULT_AREA;
      design.style.width = (area.width  * size) + '%';
      design.style.left  = ((area.left + area.width  * (x / 100)) * 100) + '%';
      design.style.top   = ((area.top  + area.height * (y / 100)) * 100) + '%';
    }

    function switchGroup(key) {
      if (!stockGroups[key]) return;
      currentGroup = key;
      var g = stockGroups[key];

      document.querySelectorAll('.garment-tab').forEach(function(t) {
        t.classList.toggle('active', t.dataset.group === key);
      });

      stockData = g.stock;

      var garment = GARMENTS[g.catalogId];
      if (garment) {
        ghostMode = null;                 // re-detect for this garment
        shirtImg.src = proxied(garment.ghost);
      }

      selectedSize = '';
      buildColorSwatches();
      buildSizeButtons();
      updateColorAvailability();
      updatePrice();

      var pl = (product.placement && typeof product.placement.size !== 'undefined')
             ? product.placement : { size: 40, x: 30, y: 35 };
      applyDesignPlacement(pl.size, pl.x, pl.y);
    }

    function buildGarmentTabs() {
      var keys = Object.keys(stockGroups);
      var el = document.getElementById('garmentTabs');
      if (!el) return;
      if (keys.length < 2) { el.innerHTML = ''; return; }   // no tabs for a single garment

      keys.sort(function(a, b) {
        var order = ['M','W','K','Y'];
        var ai = order.indexOf(stockGroups[a].tier);
        var bi = order.indexOf(stockGroups[b].tier);
        return (ai === -1 ? 99 : ai) - (bi === -1 ? 99 : bi);
      });

      el.innerHTML = keys.map(function(k) {
        var g = stockGroups[k];
        var tier = TIER_LABELS[g.tier] || g.tier;
        var label = tier + ' ' + g.garment.replace(/\b\w/g, function(m){ return m.toUpperCase(); });
        return '<button class="garment-tab" data-group="' + k + '" onclick="switchGroup(\'' + k + '\')">'
             + label + '</button>';
      }).join('');
    }

    function updateDesign() {
      var design = document.getElementById('shirtDesign');
      if (!design) return;
      var size = document.getElementById('sliderSize').value;
      var x    = document.getElementById('sliderX').value;
      var y    = document.getElementById('sliderY').value;
      applyDesignPlacement(size, x, y);
      document.getElementById('labelSize').textContent = size + '%';
      document.getElementById('labelX').textContent    = x + '%';
      document.getElementById('labelY').textContent    = y + '%';
    }

    function handleImageUpload(input) {
      var file = input.files[0];
      if (!file) return;
      uploadedFile     = file;
      uploadedFileName = file.name;
      var reader = new FileReader();
      reader.onload = function(e) {
        var design = document.getElementById('shirtDesign');
        design.src = e.target.result;
        var dropText = document.getElementById('imageDropText');
        if (dropText) {
          dropText.innerHTML = '✓ <strong>' + file.name + '</strong><br><small>Click to change</small>';
          document.getElementById('imageDropZone').style.borderColor = '#2D5A27';
          document.getElementById('imageDropZone').style.background  = '#f0fff4';
        }
      };
      reader.readAsDataURL(file);
    }

    function serializeProducts(arr) {
      var rows = arr.map(function(p) {
        return '  {\n'
          + '    id: "' + p.id + '",\n'
          + '    name: "' + p.name.replace(/"/g, '\\"') + '",\n'
          + '    shortDescription: "' + p.shortDescription.replace(/"/g, '\\"') + '",\n'
          + '    description: "' + p.description.replace(/"/g, '\\"') + '",\n'
          + '    price: ' + p.price + ',\n'
          + '    image: "' + p.image + '",\n'
          + '    stripeLink: "' + p.stripeLink + '",\n'
          + '    placement: { size: ' + p.placement.size + ', x: ' + p.placement.x + ', y: ' + p.placement.y + ' },\n'
          + '  }';
      });
      return 'const products = [\n' + rows.join(',\n') + ',\n];\n';
    }

    async function exportUpdate(pid) {
      var size   = parseInt(document.getElementById('sliderSize').value);
      var x      = parseInt(document.getElementById('sliderX').value);
      var y      = parseInt(document.getElementById('sliderY').value);
      var name   = document.getElementById('editName').value.trim();
      var short  = document.getElementById('editShort').value.trim();
      var desc   = document.getElementById('editDesc').value.trim();
      var price  = parseFloat(document.getElementById('editPrice').value);
      var stripe = document.getElementById('editStripe').value.trim();
      var image  = uploadedFile ? uploadedFileName
                                : products.find(function(p){return p.id===pid;}).image;

      var updated = products.map(function(p) {
        if (p.id !== pid) return p;
        return {
          id:               p.id,
          name:             name   || p.name,
          shortDescription: short  || p.shortDescription,
          description:      desc   || p.description,
          price:            isNaN(price) ? p.price : price,
          image:            image,
          stripeLink:       stripe || p.stripeLink,
          placement:        { size: size, x: x, y: y },
        };
      });

      var zip = new JSZip();
      zip.file('products.js', serializeProducts(updated));

      if (uploadedFile) {
        var imgData = await new Promise(function(resolve, reject) {
          var reader = new FileReader();
          reader.onload  = function(e) { resolve(e.target.result); };
          reader.onerror = reject;
          reader.readAsArrayBuffer(uploadedFile);
        });
        zip.file(uploadedFileName, imgData);
      }

      var blob = await zip.generateAsync({ type: 'blob' });
      var url  = URL.createObjectURL(blob);
      var a    = document.createElement('a');
      a.href     = url;
      a.download = 'duck-update-' + pid + '.zip';
      a.click();
      URL.revokeObjectURL(url);

      var btn = document.getElementById('exportBtn');
      btn.textContent      = '✓ Downloaded!';
      btn.style.background = '#2D5A27';
      btn.style.color      = 'white';
      setTimeout(function() {
        btn.textContent      = '⬇ Export Update';
        btn.style.background = '';
        btn.style.color      = '';
      }, 2500);
    }

    var WORKER_URL = 'https://duck-and-cover-worker.tdizzzzzzle.workers.dev';
    var catalogCache = null;

    var DUCK_IMAGES = {
      gerald:      'Gerald.svg', bernard:     'Bernard.svg',
      sid:         'DuckCream.svg', bartholomew: 'Bartholomew.svg', toby: 'Toby.svg',
    };
    var DUCK_DESC = {
      gerald:      'Roller skates. Party hat. Zero explanation.',
      bernard:     'A Hork, a Duorse, and Nigel.',
      sid:         'Cold snack, says quack.',
      bartholomew: 'Herein flies Bartholomew. Thou art warned.',
      toby:        'WHYYYY!?!',
    };

    async function getCatalog() {
      if (catalogCache) return catalogCache;
      var res = await fetch(WORKER_URL + '/get-catalog');
      catalogCache = await res.json();
      return catalogCache;
    }
    var stockData = {}; // populated after page loads

    async function handleBuyNow() {
      // Validate size selected
      if (!selectedSize) {
        var btn = document.getElementById('buyBtn');
        btn.textContent = 'Please select a size first!';
        btn.style.background = '#C41230';
        setTimeout(function() {
          btn.textContent = 'Buy Now →';
          btn.style.background = '';
        }, 2000);
        return;
      }

      var btn = document.getElementById('buyBtn');
      btn.textContent = 'Loading...';
      btn.disabled = true;
      btn.style.opacity = '0.7';

      // Show Gerald loading overlay
      var overlay = document.getElementById('loadingOverlay');
      overlay.style.display = 'flex';

      try {
        var res = await fetch(WORKER_URL + '/create-checkout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            productId:   product.id,
            productName: product.name,
            color:       currentColor,
            colorName:   document.getElementById('colorLabel').textContent,
            size:        selectedSize,
            variantGroup: currentGroup || '',
            price:       getPrice() || product.price,
          }),
        });

        var data = await res.json();

        if (data.url) {
          window.location.href = data.url;
        } else {
          throw new Error(data.error || 'No checkout URL returned');
        }
      } catch (err) {
        console.error('Checkout error:', err);
        overlay.style.display = 'none';
        btn.textContent = 'Error — try again';
        btn.style.background = '#C41230';
        btn.disabled = false;
        btn.style.opacity = '1';
        setTimeout(function() {
          btn.textContent = 'Buy Now →';
          btn.style.background = '';
        }, 3000);
      }
    }

    var imagesReady = 0;
    function imageLoaded() {
      imagesReady++;
      if (imagesReady >= 1 && document.getElementById('shirtCanvas')) {
        renderMockup(currentColor, currentHeather);
      }
    }
    shirtImg.addEventListener('load', imageLoaded);
    shirtImg.addEventListener('error', function(){ console.error('[mockup] ghost failed to load — is the Worker /ghost endpoint deployed?'); });
    if (shirtImg.complete) imageLoaded();

    var product = null;
    for (var i = 0; i < products.length; i++) {
      if (products[i].id === productId) { product = products[i]; break; }
    }

    var page = document.getElementById('productPage');

    if (!product) {
      page.innerHTML = '<p>Product not found. <a href="shop.html">Back to shop</a></p>';
    } else {
      document.title = product.name + ' — Duck & Cover';
      var pl = (product.placement && typeof product.placement.size !== 'undefined')
        ? product.placement : { size: 40, x: 30, y: 35 };

      var swatchHTML = '';

      var adminHTML = '';
      if (IS_ADMIN) {
        adminHTML =
          // ── Position panel ──
          '<div class="admin-panel" style="margin-top:1rem;">'
          + '<div class="admin-title">🛠 Admin — ' + product.name + '</div>'
          + '<div class="admin-row"><label>Size: <strong id="labelSize">' + pl.size + '%</strong></label>'
          + '<input id="sliderSize" type="range" min="1" max="100" value="' + pl.size + '" oninput="updateDesign()" /></div>'
          + '<div class="admin-row"><label>X: <strong id="labelX">' + pl.x + '%</strong></label>'
          + '<input id="sliderX" type="range" min="0" max="90" value="' + pl.x + '" oninput="updateDesign()" /></div>'
          + '<div class="admin-row"><label>Y: <strong id="labelY">' + pl.y + '%</strong></label>'
          + '<input id="sliderY" type="range" min="0" max="90" value="' + pl.y + '" oninput="updateDesign()" /></div>'
          + '</div>'

          // ── Edit fields panel ──
          + '<div class="admin-panel" style="margin-top:0.75rem;">'
          + '<div class="admin-title">✏️ Edit Product Details</div>'

          + '<div class="form-group">'
          + '<label class="admin-field-label">Name</label>'
          + '<input class="admin-field-input" id="editName" type="text" value="' + product.name + '" />'
          + '</div>'

          + '<div class="form-group">'
          + '<label class="admin-field-label">Short Description</label>'
          + '<input class="admin-field-input" id="editShort" type="text" value="' + product.shortDescription.replace(/"/g, '&quot;') + '" />'
          + '</div>'

          + '<div class="form-group">'
          + '<label class="admin-field-label">Full Description</label>'
          + '<textarea class="admin-field-input admin-field-textarea" id="editDesc">' + product.description + '</textarea>'
          + '</div>'

          + '<div class="form-group">'
          + '<label class="admin-field-label">Price ($)</label>'
          + '<input class="admin-field-input" id="editPrice" type="number" value="' + product.price + '" step="1" min="1" />'
          + '</div>'

          + '<div class="form-group">'
          + '<label class="admin-field-label">Stripe Link</label>'
          + '<input class="admin-field-input" id="editStripe" type="text" value="' + product.stripeLink + '" />'
          + '</div>'

          + '<div class="form-group">'
          + '<label class="admin-field-label">Replace Image (optional)</label>'
          + '<div class="file-drop" id="imageDropZone" onclick="document.getElementById(\'imageInput\').click()">'
          + '<div id="imageDropText">Current: <strong>' + product.image + '</strong><br><small>Click to upload a new SVG or PNG</small></div>'
          + '<input id="imageInput" type="file" accept=".svg,.png" style="display:none" onchange="handleImageUpload(this)" />'
          + '</div>'
          + '</div>'

          + '<button id="exportBtn" class="admin-export" onclick="exportUpdate(\'' + product.id + '\')">'
          + '⬇ Export Update</button>'
          + '<div class="admin-hint" style="margin-top:0.5rem;">Downloads updated products.js (+ new image if changed). Drop in project folder and push.</div>'
          + '</div>';
      }

      page.innerHTML =
        '<div class="breadcrumb">'
        + '<a href="' + (IS_ADMIN ? 'shop.html?admin=quack' : 'shop.html') + '">← Shop</a>'
        + ' / <span>' + product.name + '</span>'
        + '</div>'
        + '<div class="product-detail">'

        // Left: mockup + admin controls
        + '<div class="product-detail-img">'
        + '<div class="garment-tabs" id="garmentTabs"></div>'
        + '<div class="shirt-mockup">'
        + '<canvas id="shirtCanvas" class="shirt-canvas"></canvas>'
        + '<img id="shirtDesign" src="' + product.image + '" alt="' + product.name + '" class="shirt-design"'
        + ' style="width:' + pl.size + '%; left:' + pl.x + '%; top:' + pl.y + '%;" />'
        + '</div>'
        + adminHTML
        + '</div>'

        // Right: product info
        + '<div class="product-detail-info">'
        + '<h1>' + product.name + '</h1>'
        + '<div class="product-price" id="productPriceDisplay">~</div>'
        + '<div class="size-selector">'
        + '<div class="size-label">Size</div>'
        + '<div class="size-btns" id="sizeBtns">'
        + '<button class="size-btn" data-size="XS" onclick="setSize(\'XS\')">XS</button>'
        + '<button class="size-btn" data-size="S"  onclick="setSize(\'S\')">S</button>'
        + '<button class="size-btn active" data-size="M"  onclick="setSize(\'M\')">M</button>'
        + '<button class="size-btn" data-size="L"  onclick="setSize(\'L\')">L</button>'
        + '<button class="size-btn" data-size="XL" onclick="setSize(\'XL\')">XL</button>'
        + '<button class="size-btn" data-size="2XL" onclick="setSize(\'2XL\')">2XL</button>'
        + '<button class="size-btn" data-size="3XL" onclick="setSize(\'3XL\')">3XL</button>'
        + '</div>'
        + '</div>'
        + '<p class="product-description" id="productDescEl">' + product.description + '</p>'
        + '<div class="color-picker-section">'
        + '<div class="color-picker-label">Shirt Color — <span id="colorLabel">White</span></div>'
        + '<div class="color-swatches" id="colorSwatchContainer"><img src="Gerald.gif" style="height:40px;opacity:0.5;" alt="Loading..." /></div>'
        + '</div>'
        + '<button id="buyBtn" class="btn btn-buy" onclick="handleBuyNow()">Buy Now →</button>'
        + '<p class="buy-note" id="buyNote">Select a color and size, then click Buy Now. You\'ll be taken to Stripe\'s secure checkout.</p>'
        + '</div>'
        + '</div>';

      // Render shirt with default white
      currentColor = '#f4f5f0';
      currentHeather = false;
      if (imagesReady >= 2) renderMockup('#f4f5f0', false);

      // Update description and design image from descriptions.txt
      loadDescriptions().then(function(descs) {
        if (descs[productId]) {
          var descEl = document.getElementById('productDescEl');
          if (descEl && descs[productId].full) descEl.innerHTML = descs[productId].full;
          var designEl = document.getElementById('shirtDesign');
          if (designEl && descs[productId].image) designEl.src = descs[productId].image;
        }
      });

      // Default select White / M
      selectedSize = 'M';
      currentColor = '#f4f5f0';
      currentHeather = false;
      setTimeout(function() {
        var colorLabel = document.getElementById('colorLabel');
        if (colorLabel) colorLabel.textContent = 'White';
        document.querySelectorAll('.color-swatch').forEach(function(s) {
          s.classList.toggle('active', s.dataset.hex === '#211e16');
        });
        document.querySelectorAll('.size-btn').forEach(function(b) {
          b.classList.toggle('active', b.dataset.size === 'M');
        });
      }, 0);

      // Load stock in background, then force price update
      loadStock(product.id);

      var relGrid = document.getElementById('relatedGrid');
      products.forEach(function(p) {
        if (p.id === product.id) return;
        relGrid.innerHTML +=
          '<a href="product.html?id=' + p.id + (IS_ADMIN ? '&admin=quack' : '') + '" class="product-card">'
          + '<div class="card-img"><img src="' + p.image + '" alt="' + p.name + '" /></div>'
          + '<div class="card-info"><h3>' + p.name + '</h3><p>' + p.shortDescription + '</p>'
          + '<span class="price">$' + p.price + '</span></div></a>';
      });
    }
  </script>
</body>
</html>
