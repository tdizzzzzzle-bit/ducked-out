<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop — Duck & Cover</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>

  <nav>
    <a href="index.html" class="nav-logo">
      <img src="Gerald.svg" alt="Duck & Cover" class="nav-duck" />
      <span>Duck & Cover</span>
    </a>
    <div class="nav-links">
      <a href="shop.html" class="active">Shop</a>
      <a href="about.html">About</a>
    </div>
    <button class="nav-toggle" onclick="toggleNav()">☰</button>
  </nav>

  <div class="mobile-menu" id="mobileMenu">
    <a href="shop.html" onclick="toggleNav()">Shop</a>
    <a href="about.html" onclick="toggleNav()">About</a>
  </div>

  <div class="page-header">
    <div class="container">
      <h1>The Shop</h1>
      <p>Hand-drawn duck designs, pressed in-house on premium tees.</p>
    </div>
  </div>

  <section class="shop-section">
    <div class="container">
      <div id="adminBar"></div>
      <div class="product-grid" id="shopGrid">
        <div style="grid-column:1/-1; text-align:center; padding:3rem 0;">
          <img src="Gerald.gif" style="height:80px;" alt="Loading..." />
          <div style="font-family:var(--font-display); color:var(--text-light); margin-top:0.5rem;">Loading the flock...</div>
        </div>
      </div>
    </div>
  </section>

  <footer>
    <div class="container footer-inner">
      <a href="index.html" class="footer-logo">Duck & Cover</a>
      <p>© <span id="year"></span> Duck & Cover. All ducks reserved.</p>
      <div class="footer-links">
        <a href="shop.html">Shop</a>
        <a href="about.html">About</a>
      </div>
    </div>
  </footer>

  <script src="descriptions.js"></script>
  <script src="products.js"></script>
  <script>
    var WORKER_URL = 'https://duck-and-cover-worker.tdizzzzzzle.workers.dev';
    var SITE_URL   = 'https://tdizzzzzzle-bit.github.io/ducked-out';

    document.getElementById('year').textContent = new Date().getFullYear();

    function toggleNav() {
      document.getElementById('mobileMenu').classList.toggle('open');
    }

    var urlParams = new URLSearchParams(window.location.search);
    var IS_ADMIN  = urlParams.get('admin') === 'quack';

    if (IS_ADMIN) {
      document.getElementById('adminBar').innerHTML =
        '<div class="shop-admin-bar">'
        + '<span class="shop-admin-label">🛠 Admin Mode</span>'
        + '<a href="create-product.html?admin=quack" class="admin-export" style="display:inline-block;text-decoration:none;margin-right:0.5rem;">+ Add New Duck</a>'
        + '<a href="price-manager.html?admin=quack" class="admin-export" style="display:inline-block;text-decoration:none;background:var(--orange);">💰 Price Manager</a>'
        + '</div>';
    }

    // Known duck images — fallback to Printful thumbnail if not found
    var DUCK_IMAGES = {
      gerald:      'Gerald.svg',
      bernard:     'Bernard.svg',
      sid:         'DuckCream.svg',
      bartholomew: 'Bartholomew.svg',
      toby:        'Toby.svg',
    };

    // Known descriptions — fallback to generic if not found
    var DUCK_DESC = {
      gerald:      'Roller skates. Party hat. Zero explanation.',
      bernard:     'A Hork, a Duorse, and Nigel.',
      sid:         'Cold snack, says quack.',
      bartholomew: 'Herein flies Bartholomew. Thou art warned.',
      toby:        'WHYYYY!?!',
    };

    async function loadShop() {
      var grid = document.getElementById('shopGrid');
      var descs = await loadDescriptions();
      try {
        var res  = await fetch(WORKER_URL + '/get-catalog');
        var data = await res.json();

        if (!data.length) {
          grid.innerHTML = '<p style="grid-column:1/-1; text-align:center;">No products found.</p>';
          return;
        }

        var ORDER = ['gerald','bernard','sid','bartholomew','toby'];
        data.sort(function(a,b){
          var ai=ORDER.indexOf(a.id), bi=ORDER.indexOf(b.id);
          if(ai===-1&&bi===-1) return a.name.localeCompare(b.name);
          if(ai===-1) return 1; if(bi===-1) return -1;
          return ai-bi;
        });
        grid.innerHTML = '';
        data.forEach(function(duck) {
          var image = (descs[duck.id] && descs[duck.id].image) || DUCK_IMAGES[duck.id] || duck.thumbnail;
          var desc  = (descs[duck.id] && descs[duck.id].short) || DUCK_DESC[duck.id] || 'A very special duck.';
          var name  = (descs[duck.id] && descs[duck.id].displayName) || duck.name;
          var price = duck.minPrice ? 'From $' + duck.minPrice.toFixed(2) : '';
          var link  = 'product.html?id=' + duck.id + (IS_ADMIN ? '&admin=quack' : '');

          grid.innerHTML +=
            '<a href="' + link + '" class="product-card">'
            + '<div class="card-img"><img src="' + image + '" alt="' + name + '" /></div>'
            + '<div class="card-info">'
            + '<h3>' + name + '</h3>'
            + '<p>' + desc + '</p>'
            + '</div>'
            + '</a>';
        });

      } catch (err) {
        // Fallback to products.js if Worker fails
        console.log('Falling back to products.js:', err.message);
        grid.innerHTML = '';
        products.forEach(function(p) {
          var name = (descs[p.id] && descs[p.id].displayName) || p.name;
          var link = 'product.html?id=' + p.id + (IS_ADMIN ? '&admin=quack' : '');
          grid.innerHTML +=
            '<a href="' + link + '" class="product-card">'
            + '<div class="card-img"><img src="' + p.image + '" alt="' + name + '" /></div>'
            + '<div class="card-info">'
            + '<h3>' + name + '</h3>'
            + '<p>' + p.shortDescription + '</p>'
            + '</div>'
            + '</a>';
        });
      }
    }

    loadShop();
  </script>
</body>
</html>
