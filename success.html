<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Confirmed — Duck & Cover</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
  <nav>
    <a href="index.html" class="nav-logo">
      <img src="Gerald.svg" alt="Duck & Cover" class="nav-duck" />
      <span>Duck & Cover</span>
    </a>
  </nav>
  <div style="min-height:80vh; display:flex; align-items:center; justify-content:center; background:var(--cream); padding:2rem;">
    <div style="background:white; border-radius:28px; padding:3.5rem 3rem; text-align:center; max-width:480px; width:100%; border:2px solid #E8E0D0; box-shadow:0 12px 40px rgba(12,45,72,0.1);">
      <img src="Gerald.gif" alt="Gerald" style="width:160px; margin:0 auto 1.5rem;" />
      <div style="font-family:var(--font-display); font-weight:700; font-size:2rem; color:var(--pond); margin-bottom:0.5rem;">Order Confirmed!</div>
      <div style="font-family:var(--font-display); font-weight:600; font-size:1.1rem; color:var(--orange); margin-bottom:1rem;">Your duck is on its way.</div>
      <p style="color:#6B5E50; line-height:1.7; margin-bottom:2rem; font-size:0.95rem;">Thank you for your order! It'll be printed and shipped with maximum care and minimum drama. You'll get a confirmation email shortly.</p>
      <a href="shop.html" class="btn">Back to the Flock</a>
    </div>
  </div>
</body>
</html>
